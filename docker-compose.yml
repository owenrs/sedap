services:
  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sedap/web-api:local
    container_name: sedap-web-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
    networks:
      - sedap-net
    restart: unless-stopped

  background-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: sedap/web-api:local
    container_name: sedap-background-worker
    # Same image; runs the in-process queue worker loop on an internal port
    # (no external publish). The worker starts on app lifespan.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - .env
    environment:
      - APP_ENV=production
    networks:
      - sedap-net
    restart: unless-stopped

networks:
  sedap-net:
    driver: bridge
